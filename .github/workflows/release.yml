name: Release

# Push a tag like v1.2.0 to publish a release. The app checks the latest release on start and offers to update itself,
# so the asset names and SHA256SUMS.txt below are part of that contract (see UpdateService).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Tag '$tag' is not vX.Y.Z" }
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($tag.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test tests/TheDojo.Tests -c Release
      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -SkipTests -Version "${{ steps.version.outputs.version }}"
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @()
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create "${{ github.ref_name }}" (Get-ChildItem artifacts/release/*).FullName `
            --title "The Dojo ${{ steps.version.outputs.version }}" --generate-notes @flags
