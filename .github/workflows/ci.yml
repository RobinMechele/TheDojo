name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build TheDojo.slnx -c Release
      # The UI tests skip themselves on CI (CI=true): rendering differs between machines.
      - name: Test
        run: dotnet test TheDojo.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Publish (smoke test of the single-file exes)
        shell: pwsh
        run: |
          dotnet publish src/TheDojo -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/TheDojo
          dotnet publish src/TheDojo.Cli -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/cli
          $none = Join-Path $env:RUNNER_TEMP "none"
          ./artifacts/cli/dojo.exe summary --range 7d --offline --claude-home $none --copilot-home $none --cache (Join-Path $env:RUNNER_TEMP "dojo-cache")
          if ($LASTEXITCODE -ne 0) { throw "dojo.exe failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
